<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070B12" />
    <meta name="description" content="BookNav — 机甲科幻风格自托管导航站" />
    <title>BookNav</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('booknav-theme') || 'auto';
          if (mode !== 'auto' && mode !== 'dark' && mode !== 'light' && mode !== 'system') mode = 'auto';
          var hour = new Date().getHours();
          var dark = mode === 'dark' || (mode === 'auto' && (hour < 7 || hour >= 19)) || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#070b12' : '#e8f0f3');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
